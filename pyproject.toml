[project]
name = "bear"
version = "1.4.0"
description = "Binary Exploitation & Automated Reversing MCP server"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "capstone>=5.0.0,<6.0.0",
    "diskcache>=5.6.3,<6.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "fastmcp>=3.0.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "psutil>=5.9.0,<8.0.0",
    "pefile>=2024.8.26",
    "pwntools>=4.10.0,<5.0.0",
    "requests>=2.31.0,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.scripts]
bear-mcp = "bear.mcp:main"
bear-server = "bear.server:main"

[dependency-groups]
dev = [
    "hypothesis>=6.0.0,<7.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bear*"]

[tool.setuptools.package-data]
bear = ["ghidra_scripts/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
